name: Build Flutter APK

on:
  push:
    branches:
      - main
      - master
      - 'claude/**'
  pull_request:
    branches:
      - main
      - master
  workflow_dispatch:  # สามารถกดรันเองได้จาก GitHub UI

jobs:
  build:
    name: Build APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.35.7'
          channel: 'stable'
          cache: true

      - name: Install dependencies
        run: |
          cd axons_flutter
          flutter pub get

      - name: Build APK (Development)
        run: |
          cd axons_flutter
          flutter build apk --release -t lib/main_dev.dart

      - name: Rename APK
        run: |
          cd axons_flutter/build/app/outputs/flutter-apk
          mv app-release.apk axons-app-dev-release.apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: axons-app-dev-release
          path: axons_flutter/build/app/outputs/flutter-apk/axons-app-dev-release.apk
          retention-days: 30

      - name: Display APK Info
        run: |
          cd axons_flutter/build/app/outputs/flutter-apk
          ls -lh axons-app-dev-release.apk
          echo "✅ APK built successfully!"
          echo "📱 Download from GitHub Actions Artifacts"
